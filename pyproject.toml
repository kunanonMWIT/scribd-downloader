[project]
name = "scribd-downloader"
version = "1.0.0"
description = "Download Scribd documents as PDF - use as a CLI (uv) or import as a Python function"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Usama Nazir", url = "https://github.com/fullstackusama" },
]
keywords = ["scribd", "downloader", "pdf", "selenium", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = [
    "selenium>=4.32.0",
    "urllib3<3,>=1.26",
    "trio~=0.17",
    "trio-websocket~=0.9",
    "typing_extensions~=4.9",
    "websocket-client~=1.8",
    "pypdf>=6.0",
]

[project.urls]
Homepage = "https://github.com/kunanonMWIT/scribd-downloader"
Repository = "https://github.com/kunanonMWIT/scribd-downloader"

[project.scripts]
scribd-downloader = "scribd_downloader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scribd_downloader"]
